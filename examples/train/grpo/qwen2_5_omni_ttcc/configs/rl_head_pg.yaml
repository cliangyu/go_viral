# RL V1 — head-PG REINFORCE on the retention head (cross-ad ranking reward).
#
# Policy = diagonal Gaussian on the head's hazard logits z=linear(h_last);
# action z'=z+sigma*eps; curve=exp(-cumsum(softplus(z'))); reward = cross-ad
# percentile-rank vs the train-only CDF; advantage = within-ad group-relative;
# loss = -(logpi*A) + KL to the frozen SFT head. Implemented in
# rl/head_pg_trainer.py (Seq2SeqTrainer.compute_loss override), wired via
# rl/rl_register.py (TrainerFactory causal_lm -> HeadPGTrainer). See NORTH_STAR §10.
#
# Run-1: FREEZE the backbone (HPG_FREEZE_BACKBONE=1) -> only retention_head.linear
# trains; KL-to-SFT-head is EXACT; protects the video features that make ckpt-150
# beat the length baseline. Unfreeze in a later run.
#
# ** per_device_train_batch_size MUST be 1 ** (head reads the LITERAL last token;
# bs>1 right-pads and L-1 becomes a PAD hidden -> mismatches eval). Scale via
# gradient_accumulation_steps and more GPUs, not batch size.
#
# NOTE: no `loss_type` — HeadPGTrainer.compute_loss fully overrides the loss
# (the swift-injected compute_loss_func is popped, never used).

model: /opt/dlami/nvme/v8_eval/ckpt-150          # init RL from the SFT checkpoint (override per cluster)
torch_dtype: bfloat16
attn_impl: flash_attn

external_plugins:
  - examples/custom/qwen2_5_omni_retention/register.py
  - examples/train/grpo/qwen2_5_omni_ttcc/rl/rl_register.py
model_type: qwen2_5_omni_retention

ENV:
  RETENTION_HEAD_TYPE: hazard
  HPG_CDF: /opt/dlami/nvme/v8_eval/rl/train_cdf.npz
  HPG_G: '16'
  HPG_SIGMA: '0.2'
  HPG_KL: '0.04'
  HPG_CLIP: '1.0'
  HPG_TLO: '1'
  HPG_THI: '30'
  HPG_FREEZE_BACKBONE: '1'

dataset: /opt/dlami/nvme/v8_eval/data/ttcc_train_bypass.jsonl   # assistant=<cot></cot>, video+R
max_length: 32768
truncation_strategy: delete
lazy_tokenize: true
strict: false
dataset_num_proc: 1
group_by_length: false
remove_unused_columns: false

tuner_type: full                    # backbone frozen at runtime by HPG_FREEZE_BACKBONE
freeze_vit: true
freeze_aligner: true

gradient_checkpointing: false       # backbone frozen -> no backbone backward, no ckpt needed
vit_gradient_checkpointing: false
torch_compile: false
# deepspeed omitted: run-1 freezes the backbone -> plain DDP (3B fits one H100)

num_train_epochs: 1
learning_rate: 1.0e-4               # head lr (smoke best); backbone frozen
warmup_ratio: 0.03
max_grad_norm: 1.0                  # == HPG_CLIP
per_device_train_batch_size: 1      # REQUIRED (see header)
gradient_accumulation_steps: 8      # effective ads/step = 1 * 8 * world_size

logging_steps: 1
eval_strategy: 'no'                 # held-out cross-ad SRCC evaluated separately (eval_ibs bypass)
save_steps: 25
save_total_limit: 20
report_to: [tensorboard, wandb]
output_dir: /opt/dlami/nvme/ssm-out/rl_head_pg_v1

dataloader_num_workers: 4
dataloader_persistent_workers: true
dataloader_prefetch_factor: 4
