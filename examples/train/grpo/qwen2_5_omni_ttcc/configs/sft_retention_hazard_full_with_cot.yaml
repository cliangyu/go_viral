# SFT, retention head (hazard), FULL fine-tune, WITH CoT.
#
# Custom model_type qwen2_5_omni_retention with a softplus hazard head
# reading the hidden state at the last </cot> token. R(t) = exp(-cumsum(λ))
# is monotone non-increasing by construction.
#
# Joint loss:
#   L = masked_MSE(R_pred, R_true) + RETENTION_COT_ALPHA * LM_CE(assistant_tokens)
#
# Continuation training from a converged hazard-only SFT checkpoint
# (path under `model:` below). Initialization from the base
# Qwen/Qwen2.5-Omni-3B is also valid but the head starts fresh.

# Default to V7's final saved checkpoint; override at CLI if continuing
# from a different intermediate ckpt.
model: /opt/dlami/nvme/ckpts/checkpoint-3675
torch_dtype: bfloat16
attn_impl: flash_attn

external_plugins:
  - examples/custom/qwen2_5_omni_retention/register.py
model_type: qwen2_5_omni_retention
loss_type: retention_loss

# Head-type and CoT loss weight are env-var-driven (read by the plugin).
# ENV key is mandatory — see swift/cli/main.py:53.
#
# Alpha scale rationale: at convergence, curve MSE is ~1e-4 and per-token
# CoT cross-entropy is ~3, so the principled "balanced gradients" weighting
# is alpha = curve_MSE / CE = 3e-5. The previous V3 setting (alpha=0.1 with
# log-hazard MSE) was equivalent to ~1e-5 in plain-MSE units. We pick 3e-5
# as the literature-grounded default; an empirical 60-step 2-GPU sweep over
# {1e-4, 1e-3, 1e-2} did not distinguish them on held-out IBS, so we rely
# on the analytical balance rather than the noisy sweep.
ENV:
  RETENTION_HEAD_TYPE: hazard
  RETENTION_COT_ALPHA: '3e-5'

# CoT-distilled dataset (merged with the no-CoT base via build_v8_train_jsonl.py).
# Each row carries R (per-second retention) and an assistant span wrapping
# `<cot>...</cot>` with the Gemini-distilled reasoning.
dataset: /home/ssm-user/work/data/ttcc_v8/ttcc_train_with_cot.jsonl
val_dataset: /home/ssm-user/work/data/ttcc_holdout/val_200_no_cot.jsonl
eval_strategy: steps
max_length: 32768
truncation_strategy: delete
lazy_tokenize: true
strict: false
dataset_num_proc: 1
group_by_length: false
# Required: the retention plugin's _data_collator reads R from the raw row
# (via _extra_kwargs) to build r_true / r_mask. Removing unused columns
# strips R before collation.
remove_unused_columns: false

# Full FT; freeze the audio/visual towers and aligner to match milestone spec.
tuner_type: full
freeze_vit: true
freeze_aligner: true

# Full FT needs ZeRO-3 to fit the optimizer state (Adam fp32 ≈ 8× param size).
gradient_checkpointing: true
vit_gradient_checkpointing: true
torch_compile: false                          # head is too small to amortize compile
deepspeed: zero3

# 5 epochs since we start from a converged hazard checkpoint; the LM head
# needs to learn CoT generation while the hazard head re-adapts to reading
# h[</cot>] instead of h[last_input_token]. Lower LR than V7's 5e-6 because
# we're fine-tuning a converged base rather than training from scratch.
num_train_epochs: 5
learning_rate: 1.0e-6
warmup_ratio: 0.03
max_grad_norm: 1.0
per_device_train_batch_size: 1
gradient_accumulation_steps: 8

logging_steps: 1
eval_steps: 50
save_steps: 75
save_total_limit: 10
report_to: [tensorboard, wandb]
output_dir: /opt/dlami/nvme/ssm-out/sft_retention_hazard_full_with_cot

dataloader_num_workers: 4
dataloader_persistent_workers: true
dataloader_prefetch_factor: 4
