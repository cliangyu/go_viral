# CoT-GRPO — RL on the GENERATED CoT, reward = the retention HEAD reading that CoT.
#
# Official swift GRPO (rlhf_type=grpo) drives generation / advantage / KL / vLLM / multi-node.
# The ONLY custom part is the reward: CoTGRPOTrainer fills the `ttcc_head` column by forwarding
# the policy through the head on each generated CoT (cross-ad rank vs the train CDF + IBS anchor).
#
# ** LAUNCH: RL_ENTRY=rl/train_cot_grpo.py bash rl.sh configs/rl_cot_grpo.yaml ** (NOT `swift sft`/`swift rlhf`).
# Multi-node (2x8): set NNODES=2 NODE_RANK={0,1} MASTER_ADDR=<node0> MASTER_PORT=29501 (SFT holds 29500).
# Tonight = LoRA + last-token head (lower risk; see COT_RL_PLAN.md §7). Warm-start from the SFT-with-CoT adapter.

model: /opt/dlami/nvme/home/ssm-user/work/hf-cache/Qwen2.5-Omni-3B
# adapters: warm-start from the FINAL SFT-with-CoT (shift-fixed) checkpoint. Override per run:
#   --override 'adapters=[/opt/dlami/nvme/ssm-out/sft_retention_hazard_lora_v8_with_cot/v0-20260530-143449/checkpoint-XXXX]'
adapters:
  - /opt/dlami/nvme/ssm-out/sft_readout_v2_attn_pool/v0-20260531-225451/checkpoint-550
torch_dtype: bfloat16
attn_impl: flash_attn                 # PINNED; head readout kernel must match the SRCC baseline

external_plugins:
  - examples/custom/qwen2_5_omni_retention/register.py      # model + retention head
  - examples/train/grpo/plugin/ttcc_head_plugin.py          # head-reward column placeholder (filled by the trainer)
  - examples/train/grpo/plugin/ttcc_cot_format_plugin.py    # <cot>...</cot> structure reward
model_type: qwen2_5_omni_retention

rlhf_type: grpo

ENV:
  RETENTION_HEAD_TYPE: hazard
  RETENTION_READOUT: attn_pool       # B2 attn-pool readout -- MUST match the SFT ckpt; default last_token is the silent-degrade trap
  # --- Video/length caps: MUST match the B2 SFT (sft_readout_v2_attn_pool) processing. These mirror _common.sh and are pinned here so the GRPO rollout uses the SAME video representation B2 trained on (alignment) and the prompt seq stays bounded (~<=8192), preventing the lm_head OOM.
  FPS: '1.0'
  FPS_MAX_FRAMES: '60'
  VIDEO_MAX_TOKEN_NUM: '8192'
  MAX_PIXELS: '200704'           # B2 SFT value (_common.sh); restored (None was a wrong removal)
  VIDEO_MAX_PIXELS: '200704'     # B2 SFT value (_common.sh)
  ENABLE_AUDIO_OUTPUT: 'false'  # match B2 SFT
  MAX_LENGTH: '32768'      # B2 SFT actual value (verified args.json/log); prior 8192 was a wrong fix that deleted long rows
  USE_AUDIO_IN_VIDEO: 'true'       # B2 SFT trained with use_audio_in_video=True (verified in its log); GRPO MUST match
  TRAIN_CDF: /opt/dlami/nvme/home/ssm-user/work/data/ttcc_v8/train_cdf.npz   # train-only, val-disjoint (read by CoTGRPOTrainer)
  COT_BETA: '1.0'                     # R_rank weight (cross-ad, primary)
  COT_ALPHA: '0.25'                   # R_acc = 1-IBS calibration anchor
  COT_T_LO: '1'
  COT_T_HI: '30'

# --- RL data: assistant=<cot></cot> (model GENERATES the CoT); R/T/ad_id carried for the reward ---
dataset: /opt/dlami/nvme/home/ssm-user/work/data/ttcc_v8/ttcc_train_bypass.jsonl
max_length: 32768                     # REVERTED from wrong 8192 -> B2's actual SFT max_length; OOM is fixed by VIDEO_MAX_TOKEN_NUM=8192, not by shortening this
truncation_strategy: delete
lazy_tokenize: true
strict: false
remove_unused_columns: false          # KEEP R / T / ad_id for the reward
group_by_length: false

# --- GRPO rollout (HP base = grpo.sh; the matching TEXT-GRPO evidence) ---
num_generations: 8                    # G; raised from grpo.sh's 4 for group rank statistics + the curve-std gate
temperature: 1.0
top_p: 1.0
max_completion_length: 768            # measured CoT p99=430, max 527
overlong_filter: true            # RL length-growth insurance: drop truncated (overlong) completions from the loss (swift args_mixin overlong_filter)
beta: 0.001                           # KL to SFT ref (grpo.sh: 0.04 was 16x too strong)
reward_funcs: [ttcc_head, ttcc_cot_format]
reward_weights: ['1.0', '0.15']    # QUOTED: numeric yaml lists crash parse_yaml_args (floats into argv, not str())
# HF generate (TransformersEngine), NOT vLLM. vLLM can't load our custom qwen2_5_omni_retention
# head (no r_pred -> no reward) and its Qwen-Omni video+audio support is incomplete; our entire
# pipeline (generate_eval, SFT eval) uses model.generate(). swift gates vllm behind is_vllm_available
# so use_vllm=false needs no vllm installed. Slower rollouts, but correct + proven-compatible.
use_vllm: false
log_completions: true

# --- tuner: LoRA on the text decoder (tonight's lower-risk choice) ---
# NOTE: with `adapters:` set, swift continues the SFT adapter (tuner.from_pretrained) and INHERITS its
# adapter_config.json -- lora_rank/alpha/target_modules below are IGNORED (no fresh LoRA stacked). Kept for clarity.
tuner_type: lora
lora_rank: 16
lora_alpha: 32
target_modules: all-linear
freeze_vit: true
freeze_aligner: true

gradient_checkpointing: true
deepspeed: zero2                      # grpo.sh backend for LoRA GRPO
torch_compile: false

num_train_epochs: 1
learning_rate: 5.0e-6                 # grpo.sh (LoRA GRPO)
warmup_ratio: 0.03
max_grad_norm: 1.0
per_device_train_batch_size: 1        # head re-encodes one row at a time -> no last-token pad issue
gradient_accumulation_steps: 8

logging_steps: 1
eval_strategy: 'no'                   # held-out cross-ad SRCC tracked out-of-loop per checkpoint
save_steps: 25
save_total_limit: 20
report_to: [tensorboard, wandb]
output_dir: /opt/dlami/nvme/ssm-out/rl_cot_grpo_v1

dataloader_num_workers: 4
